[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrsing"
version = "0.1.0"
description = "A Python parsing library."
authors = [
    { name = "samuelcorradi" }
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# extra dependencies that are only used for development (e.g., tests).
# they are installed with: pip install .[dev]
dev = [
    "pytest==9.0.1"
]
